[package]
name = "atelier-document"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
automerge = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"

# Automerge uses rand 0.10/getrandom 0.4 on browser WASM.
getrandom = { version = "0.4", features = ["wasm_js"] }

# Automerge 0.11's debug-only fast/slow cursor comparison disagrees on a
# deleted trailing character. Use its production cursor behavior in local tests;
# assertions remain enabled for this crate. See the deleted-reference cursor test.
[profile.dev.package.automerge]
debug-assertions = false
